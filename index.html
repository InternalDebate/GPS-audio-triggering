<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghosts of the Maliebaan</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header-title">
        <h1 id="header-h1">Ghosts of the Maliebaan</h1>
        <button id="start-btn">PRESS TO START</button>
    </div>

    <div id="right-panel">
        <div id="status-panel">
            <p id="status">Ready...</p>
            <div id="center-coords">0.0000, 0.0000</div>
            
            <hr>
        </div>
    </div>

    <div id="map"></div>
    <div id="crosshair">+</div>

    <div id="debug-console" style="display: none;">
        <div id="debug-header">
            <span>Debug Log</span>
            <button onclick="clearLog()">Clear</button>
        </div>
        <div id="log-container"></div>
    </div>

    <button id="toggle-console" title="Toggle Debug">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M2 17h20"/>
            <path d="M6 21h12"/>
        </svg>
    </button>
    <button id="locate-btn" title="Center on Me">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="8"/>
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
            <path d="M12 1v4M12 19v4M23 12h-4M5 12H1"/>
        </svg>
    </button>
    <button id="toggle-satellite" title="Toggle Satellite">        
    </button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
